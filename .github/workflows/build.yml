name: Build

on:
  push:
    branches: ['v*', 'ci_test']
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: ['master', 'dev', 'ci_test', 'v*']
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  packages: read

env:
  BUILD_TYPE: RelWithDebInfo
  QT_VERSION: '6.10.2'
  CMAKE_VERSION: '3.22'

jobs:
  linux-build:
    name: 'Build Linux (${{ matrix.dist.name }})'
    runs-on: ${{ matrix.dist.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dist:
          - name: amd64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - name: arm64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64

    steps:
      - name: 'Checkout Source code'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: 'Record Start Time'
        run: echo "BUILD_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: 'Fix Git Safe Directory'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 'Get Version'
        id: version
        uses: ./.github/actions/get-version

      - name: 'Export Version'
        run: |
          echo "VERSION=${{ steps.version.outputs.VERSION }}" >> "$GITHUB_ENV"

      - name: 'Install System Dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libtiff-dev \
            ccache \
            ninja-build

      - name: 'Setup CCache'
        run: ccache --version

      - name: 'Install Qt 6.10.2'
        run: |
          pip3 install --no-cache-dir --break-system-packages aqtinstall==3.2.1
          aqt install-qt ${{ matrix.dist.qt_host }} desktop 6.10.2 ${{ matrix.dist.qt_arch }} --outputdir /opt/qt --modules qtshadertools qtimageformats
          echo "/opt/qt/6.10.2/${{ matrix.dist.qt_dir }}/bin" >> "$GITHUB_PATH"
          echo "Qt6_DIR=/opt/qt/6.10.2/${{ matrix.dist.qt_dir }}/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: 'Configure CMake'
        run: |
          export QT_QML_DISABLE_AOT_COMPILE=1
          export QML_DISABLE_DISK_CACHE=1
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_SYMBOL_FOOTPRINT_DEBUG_EXPORT=OFF \
            -DEASYKICONVERTER_BUILD_TESTS=ON \
            -DVERSION_FROM_CI=${{ env.VERSION }}

      - name: 'Build'
        run: |
          export QT_QML_DISABLE_AOT_COMPILE=1
          cmake --build build --config RelWithDebInfo --parallel 4

      - name: 'CCache Stats'
        run: |
          ccache -sv
          {
            echo "## CCache Statistics"
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Build Statistics'
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START_TIME))
          RATE=0.008
          COST=$(awk "BEGIN {printf \"%.4f\", $DURATION * $RATE / 60}")
          {
            echo "## Build Cost Summary (Linux)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Job duration | ${DURATION}s ($((DURATION/60))m $((DURATION%60))s) |"
            echo "| Est. cost | \$${COST} (Linux × \$0.008/min) |"
            echo "| Build dir size | $(du -sh build/ 2>/dev/null | cut -f1) |"
            echo "| Free disk | $(df -h . | tail -1 | awk '{print $4}') |"
            echo "| Memory used | $(free -h 2>/dev/null | awk '/^Mem:/ {print $3 "/" $2}' || echo N/A) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Run Tests'
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build -C RelWithDebInfo --output-on-failure --no-tests=error


  windows-build:
    name: 'Build Windows (${{ matrix.name }})'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Windows MSVC'
            runner: 'windows-2022'
            platform: 'msvc2022_64'
            generator: 'Ninja'
            arch: 'x64'
            qt_host: 'windows'
            qt_arch: 'win64_msvc2022_64'
            vcpkg_triplet: 'x64-windows'
            setup_cmake: true
            enable_ccache: true
          - name: 'Windows ARM64'
            runner: 'windows-11-arm'
            platform: 'msvc2022_arm64'
            generator: 'Ninja'
            arch: 'arm64'
            qt_host: 'windows_arm64'
            qt_arch: 'win64_msvc2022_arm64'
            vcpkg_triplet: 'arm64-windows'
            setup_cmake: false
            enable_ccache: false
    steps:
      - name: 'Checkout Source code'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: 'Record Start Time'
        shell: pwsh
        run: echo "BUILD_START_TIME=$(Get-Date -Format o)" >> $env:GITHUB_ENV

      - name: 'Setup MSVC'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.arch }}

      - name: 'Setup vcpkg'
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.vcpkg_triplet }}

      - name: 'Setup Build Environment (MSVC)'
        uses: ./.github/actions/setup-env
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          qt-version: ${{ env.QT_VERSION }}
          qt-host: ${{ matrix.qt_host }}
          qt-target: 'desktop'
          qt-arch: ${{ matrix.qt_arch }}
          setup-cmake: ${{ matrix.setup_cmake }}
          enable-ccache: 'false'
          enable-sccache: 'false'

      - name: 'Install Ninja'
        shell: pwsh
        run: |
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) {
            Write-Host "Ninja is already available:"
            ninja --version
          } else {
            choco install ninja --version=1.12.1 -y --no-progress
          }

      - name: 'Install ccache'
        if: matrix.enable_ccache
        shell: pwsh
        run: |
          choco install ccache --version=4.11.1 -y --no-progress
          echo "CCACHE_DIR=${{ runner.temp }}\ccache" >> $env:GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $env:GITHUB_ENV
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $env:GITHUB_ENV
          echo "CCACHE_NOHASHDIR=true" >> $env:GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV

      - name: 'Restore CCache'
        if: matrix.enable_ccache
        id: cache-ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\ccache
          key: win-ccache-${{ matrix.platform }}-${{ env.BUILD_TYPE }}-${{ env.QT_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-ccache-${{ matrix.platform }}-${{ env.BUILD_TYPE }}-${{ env.QT_VERSION }}-
            win-ccache-${{ matrix.platform }}-${{ env.BUILD_TYPE }}-
            win-ccache-${{ matrix.platform }}-

      - name: 'Configure CMake (Ninja + ccache) with vcpkg'
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-B', 'build',
            '-G', 'Ninja',
            "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR",
            "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}",
            '-DCMAKE_C_FLAGS_RELWITHDEBINFO=/MD /O2 /Ob1 /DNDEBUG /Z7',
            '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=/MD /O2 /Ob1 /DNDEBUG /Z7',
            '-DCMAKE_C_COMPILER=cl',
            '-DCMAKE_CXX_COMPILER=cl',
            '-DENABLE_SYMBOL_FOOTPRINT_DEBUG_EXPORT=OFF',
            '-DEASYKICONVERTER_BUILD_TESTS=ON',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DCI=ON'
          )
          if ("${{ matrix.enable_ccache }}" -eq "true") {
            $cmakeArgs += '-DCMAKE_C_COMPILER_LAUNCHER=ccache'
            $cmakeArgs += '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
          }
          cmake @cmakeArgs

      - name: 'Build'
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 16

      - name: 'CCache Stats'
        if: matrix.enable_ccache
        shell: pwsh
        run: |
          ccache -sv
          echo "## CCache Statistics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 'Save CCache'
        if: always() && matrix.enable_ccache && steps.cache-ccache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: 'Build Statistics'
        if: always()
        shell: pwsh
        run: |
          $endTime = Get-Date
          $startTime = [DateTime]::Parse($env:BUILD_START_TIME)
          $duration = $endTime - $startTime
          $rate = 0.016
          $cost = [math]::Round($duration.TotalMinutes * $rate, 4)
          $buildSize = if (Test-Path build) { [math]::Round((Get-ChildItem -Path build -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB, 1) } else { 0 }
          $freeDisk = [math]::Round((Get-PSDrive -Name (Get-Location).Drive.Name).Free / 1GB, 1)
          "## Build Cost Summary (Windows)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Metric | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|--------|-------|" >> $env:GITHUB_STEP_SUMMARY
          "| Job duration | $([math]::Floor($duration.TotalMinutes))m $($duration.Seconds)s |" >> $env:GITHUB_STEP_SUMMARY
          "| Est. cost | `$${cost} (Windows × `$0.016/min) |" >> $env:GITHUB_STEP_SUMMARY
          "| Build dir size | ${buildSize} MB |" >> $env:GITHUB_STEP_SUMMARY
          "| Free disk | ${freeDisk} GB |" >> $env:GITHUB_STEP_SUMMARY

      - name: 'Run Tests'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $env:QT_QPA_PLATFORM = "offscreen"
          $ctestArguments = "--test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure --no-tests=error"
          $ctestProcess = Start-Process -FilePath "ctest" -ArgumentList $ctestArguments -NoNewWindow -Wait -PassThru
          $ctestExitCode = $ctestProcess.ExitCode
          if ($ctestExitCode -ne 0) {
            # 使用 CTest 记录的失败清单重跑实际失败项，避免硬编码无关测试掩盖真实断言。
            $rerunStdout = Join-Path $env:RUNNER_TEMP "ctest-rerun-failed.stdout.log"
            $rerunStderr = Join-Path $env:RUNNER_TEMP "ctest-rerun-failed.stderr.log"
            $rerunArguments = @(
              "--test-dir", "build",
              "-C", "${{ env.BUILD_TYPE }}",
              "--rerun-failed",
              "--output-on-failure",
              "--no-tests=error"
            )
            $rerunProcess = Start-Process -FilePath "ctest" -ArgumentList $rerunArguments -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $rerunStdout -RedirectStandardError $rerunStderr
            Write-Host "ctest --rerun-failed exit code: $($rerunProcess.ExitCode)"
            if (Test-Path $rerunStdout) { Get-Content $rerunStdout }
            if (Test-Path $rerunStderr) { Get-Content $rerunStderr }

            # CTest 可能只报告 ***Failed 而不转发 QtTest 输出，直接运行失败测试收集原始进程信息。
            $failedTestsFile = Join-Path $env:GITHUB_WORKSPACE "build\Testing\Temporary\LastTestsFailed.log"
            $failedTestNames = @()
            if (Test-Path $failedTestsFile) {
              $failedTestNames = @(
                Get-Content $failedTestsFile | ForEach-Object {
                  if ($_ -match '^\s*\d+:(?<name>[^\s]+)\s*$') {
                    $Matches['name']
                  }
                } | Sort-Object -Unique
              )
            }
            foreach ($testName in $failedTestNames) {
              $testExecutable = Join-Path $env:GITHUB_WORKSPACE "build\bin\${testName}.exe"
              if (-not (Test-Path $testExecutable)) {
                Write-Warning "Failed test executable not found: $testExecutable"
                continue
              }

              $testStdout = Join-Path $env:RUNNER_TEMP "${testName}.stdout.log"
              $testStderr = Join-Path $env:RUNNER_TEMP "${testName}.stderr.log"
              $testProcess = Start-Process -FilePath $testExecutable -ArgumentList "-vs" -WorkingDirectory (Get-Location) -Wait -PassThru `
                -RedirectStandardOutput $testStdout -RedirectStandardError $testStderr
              $unsignedExitCode = [uint32]$testProcess.ExitCode
              $hexExitCode = "0x{0:X8}" -f $unsignedExitCode
              Write-Host "${testName}.exe exit code: $($testProcess.ExitCode) ($hexExitCode)"
              if (Test-Path $testStdout) { Get-Content $testStdout }
              if (Test-Path $testStderr) { Get-Content $testStderr }
            }
            exit $ctestExitCode
          }

  macos-build:
    name: 'Build macOS'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'macOS ARM64'
            os: macos-14
          - name: 'macOS Intel'
            os: macos-15
    steps:
      - name: 'Checkout Source code'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: 'Record Start Time'
        run: echo "BUILD_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: 'Setup Build Environment'
        uses: ./.github/actions/setup-env
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          qt-version: ${{ env.QT_VERSION }}
          qt-host: 'mac'
          qt-target: 'desktop'
          enable-ccache: 'true'
          enable-sccache: 'false'

      - name: 'Configure CMake with CCache'
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_SYMBOL_FOOTPRINT_DEBUG_EXPORT=OFF \
            -DEASYKICONVERTER_BUILD_TESTS=ON \
            -DCI=ON

      - name: 'Build'
        run: |
          cmake --build build --config "$BUILD_TYPE" --parallel 4

      - name: 'CCache Stats'
        run: |
          ccache -sv
          {
            echo "## CCache Statistics"
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Build Statistics'
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START_TIME))
          RATE=0.08
          COST=$(awk "BEGIN {printf \"%.4f\", $DURATION * $RATE / 60}")
          {
            echo "## Build Cost Summary (macOS)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Job duration | ${DURATION}s ($((DURATION/60))m $((DURATION%60))s) |"
            echo "| Est. cost | \$${COST} (macOS × \$0.08/min) |"
            echo "| Build dir size | $(du -sh build/ 2>/dev/null | cut -f1) |"
            echo "| Free disk | $(df -h . | tail -1 | awk '{print $4}') |"
            echo "| Memory pressure | $(vm_stat 2>/dev/null | awk '/Pages free/ {free=$NF} /Pages active/ {active=$NF} END {printf "free=%d active=%d", free, active}' || echo N/A) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Run Tests'
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build -C "$BUILD_TYPE" --output-on-failure --no-tests=error

