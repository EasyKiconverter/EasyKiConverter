name: Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '已有的语义版本标签，例如 v3.1.12'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-target:
    name: Validate release target
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.target.outputs.tag_name }}
      version: ${{ steps.target.outputs.version }}
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate tag and version
        id: target
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag_name="$RELEASE_TAG"
          if [[ ! "$tag_name" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag_name"
            echo "Expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
            echo "Tag not found: $tag_name"
            exit 1
          fi
          tag_type="$(git cat-file -t "refs/tags/$tag_name")"
          case "$tag_type" in
            tag)
              echo "Release tag is annotated: $tag_name"
              ;;
            commit)
              echo "::warning::Release tag is lightweight rather than annotated: $tag_name"
              ;;
            *)
              echo "Invalid release tag object type '$tag_type': $tag_name"
              exit 1
              ;;
          esac

          target_sha="$(git rev-parse "refs/tags/$tag_name^{commit}")"
          version="${tag_name#[vV]}"
          if ! grep -Eq "set\(VERSION_FROM_CI \"$version\"\)" CMakeLists.txt; then
            echo "CMakeLists.txt default version does not match $version"
            exit 1
          fi

          release_branch_found=false
          while read -r branch; do
            # 允许当前 AppImage 修复分支承载待验证的版本标签；修复完成后应合并回 master。
            if [[ "$branch" =~ origin/(master|v[0-9]+\.[0-9]+\.[0-9]+|fix/appimage-runtime-dependencies)$ ]]; then
              release_branch_found=true
              break
            fi
          done < <(git branch -r --contains "$target_sha")
          if [[ "$release_branch_found" != true ]]; then
            echo "Tag target is not contained in an allowed release branch"
            git branch -r --contains "$target_sha" || true
            exit 1
          fi

          {
            echo "tag_name=$tag_name"
            echo "version=$version"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

  package-linux:
    name: Package Linux
    needs: resolve-target
    uses: ./.github/workflows/pack-linux.yml
    with:
      tag_name: ${{ needs.resolve-target.outputs.tag_name }}
      target_sha: ${{ needs.resolve-target.outputs.target_sha }}
    permissions:
      contents: read
      packages: read

  package-windows:
    name: Package Windows
    needs: resolve-target
    uses: ./.github/workflows/pack-windows.yml
    with:
      tag_name: ${{ needs.resolve-target.outputs.tag_name }}
      target_sha: ${{ needs.resolve-target.outputs.target_sha }}
    permissions:
      contents: read

  package-macos:
    name: Package macOS
    needs: resolve-target
    uses: ./.github/workflows/pack-macos.yml
    with:
      tag_name: ${{ needs.resolve-target.outputs.tag_name }}
      target_sha: ${{ needs.resolve-target.outputs.target_sha }}
    permissions:
      contents: read

  publish:
    name: Validate and publish release
    needs: [resolve-target, package-linux, package-windows, package-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Download packaging artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifact_downloads

      - name: Flatten artifacts and reject collisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          declare -A seen
          while IFS= read -r -d '' file; do
            artifact_path="${file#artifact_downloads/}"
            artifact_name="${artifact_path%%/*}"
            [[ "$artifact_name" == built-appdir-* ]] && continue
            filename="$(basename "$file")"
            if [[ -n "${seen[$filename]+x}" ]]; then
              echo "Artifact filename collision: $filename"
              exit 1
            fi
            seen["$filename"]="$file"
            cp "$file" "release_assets/$filename"
          done < <(find artifact_downloads -type f -print0)

          if [[ -z "$(find release_assets -type f -print -quit)" ]]; then
            echo "No release assets were downloaded"
            exit 1
          fi

      - name: Validate expected assets and SHA256 files
        shell: bash
        env:
          VERSION: ${{ needs.resolve-target.outputs.version }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          require_asset() {
            local pattern="$1"
            if ! compgen -G "release_assets/$pattern" >/dev/null; then
              echo "Missing release asset: $pattern"
              exit 1
            fi
          }

          require_asset '*-windows-x86_64-portable.zip'
          require_asset '*-windows-arm64-portable.zip'
          require_asset '*-windows-x86_64-installer.exe'
          require_asset '*-windows-arm64-installer.exe'
          require_asset '*-linux-x86_64.AppImage'
          require_asset '*-linux-aarch64.AppImage'
          require_asset '*-linux-amd64.deb'
          require_asset '*-linux-arm64.deb'
          require_asset '*-linux-x86_64.rpm'
          require_asset '*-linux-aarch64.rpm'
          require_asset '*-linux-x86_64.pkg.tar.zst'
          require_asset '*-linux-aarch64.pkg.tar.zst'
          require_asset '*-macos-intel.dmg'
          require_asset '*-macos-arm64.dmg'
          require_asset '*-windows-x86_64.msix'
          require_asset '*-windows-arm64.msix'

          while IFS= read -r asset; do
            filename="$(basename "$asset")"
            case "$filename" in
              EasyKiConverter-${VERSION}-*) ;;
              *)
                echo "Asset version or commit mismatch: $filename"
                exit 1
                ;;
            esac
          done < <(find release_assets -maxdepth 1 -type f ! -name '*.sha256sum' ! -name 'SHA256SUMS' -print)

          while IFS= read -r checksum; do
            [[ -s "$checksum" ]] || { echo "Empty checksum file: $checksum"; exit 1; }
            (cd release_assets && sha256sum -c "$(basename "$checksum")")
            asset_name="${checksum%.sha256sum}"
            [[ -f "$asset_name" ]] || { echo "Checksum has no matching asset: $checksum"; exit 1; }
            referenced_asset="$(awk '{print $2}' "$checksum" | sed 's/^\*//' | tr -d '\r' | xargs -r basename)"
            [[ "$referenced_asset" == "$(basename "$asset_name")" ]] || {
              echo "Checksum file references an unexpected asset: $checksum"
              exit 1
            }
          done < <(find release_assets -maxdepth 1 -type f -name '*.sha256sum' -print)

          checksum_count="$(find release_assets -maxdepth 1 -type f -name '*.sha256sum' | wc -l)"
          asset_count="$(find release_assets -maxdepth 1 -type f \! -name '*.sha256sum' \! -name 'SHA256SUMS' | wc -l)"
          [[ "$checksum_count" -eq "$asset_count" ]] || {
            echo "Every release asset must have exactly one .sha256sum file"
            exit 1
          }

      - name: Generate aggregate SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="release_assets/SHA256SUMS"
          : > "$manifest"
          while IFS= read -r asset; do
            sha256sum "release_assets/$asset" >> "$manifest"
          done < <(find release_assets -maxdepth 1 -type f ! -name '*.sha256sum' ! -name 'SHA256SUMS' -printf '%f\n' | sort)
          test -s "$manifest"

      - name: Generate structured release notes
        env:
          TAG_NAME: ${{ needs.resolve-target.outputs.tag_name }}
          VERSION: ${{ needs.resolve-target.outputs.version }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          LINUX_RESULT: ${{ needs.package-linux.result }}
          WINDOWS_RESULT: ${{ needs.package-windows.result }}
          MACOS_RESULT: ${{ needs.package-macos.result }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "$TAG_NAME^" 2>/dev/null || true)"
          range="$TAG_NAME"
          [[ -n "$previous_tag" ]] && range="$previous_tag..$TAG_NAME"

          download_rows="$(mktemp)"
          trap 'rm -f "$download_rows"' EXIT

          release_row() {
            local platform="$1"
            local filename="$2"
            local platform_order
            local architecture
            local architecture_display
            local architecture_order
            local format
            local format_order

            case "$platform" in
              Windows) platform_order=1 ;;
              Linux) platform_order=2 ;;
              macOS) platform_order=3 ;;
              *) return 0 ;;
            esac

            case "$platform:$filename" in
              "Windows:"*-windows-arm64-portable.zip) architecture="arm64"; format="便携版 ZIP"; format_order=2 ;;
              "Windows:"*-windows-x86_64-portable.zip) architecture="x86_64"; format="便携版 ZIP"; format_order=2 ;;
              "Windows:"*-windows-arm64-installer.exe) architecture="arm64"; format="安装程序 EXE"; format_order=1 ;;
              "Windows:"*-windows-x86_64-installer.exe) architecture="x86_64"; format="安装程序 EXE"; format_order=1 ;;
              "Windows:"*-windows-arm64.msix) architecture="arm64"; format="MSIX"; format_order=3 ;;
              "Windows:"*-windows-x86_64.msix) architecture="x86_64"; format="MSIX"; format_order=3 ;;
              "Linux:"*-linux-aarch64.AppImage) architecture="arm64"; format="AppImage"; format_order=1 ;;
              "Linux:"*-linux-x86_64.AppImage) architecture="amd64"; format="AppImage"; format_order=1 ;;
              "Linux:"*-linux-arm64.deb) architecture="arm64"; format="DEB"; format_order=2 ;;
              "Linux:"*-linux-amd64.deb) architecture="amd64"; format="DEB"; format_order=2 ;;
              "Linux:"*-linux-aarch64.rpm) architecture="arm64"; format="RPM"; format_order=3 ;;
              "Linux:"*-linux-x86_64.rpm) architecture="amd64"; format="RPM"; format_order=3 ;;
              "Linux:"*-linux-aarch64.pkg.tar.zst) architecture="arm64"; format="Arch Linux"; format_order=4 ;;
              "Linux:"*-linux-x86_64.pkg.tar.zst) architecture="amd64"; format="Arch Linux"; format_order=4 ;;
              "macOS:"*-macos-arm64.dmg) architecture="arm64"; format="DMG"; format_order=1 ;;
              "macOS:"*-macos-intel.dmg) architecture="intel"; format="DMG"; format_order=1 ;;
              *) return 0 ;;
            esac

            case "$architecture" in
              x86_64)
                architecture_order=1
                architecture_display="x86_64"
                ;;
              amd64)
                architecture_order=1
                architecture_display="amd64"
                ;;
              arm64)
                architecture_order=2
                architecture_display="arm64"
                ;;
              intel)
                architecture_order=3
                architecture_display="intel"
                ;;
              *) return 0 ;;
            esac

            printf '%s\t%s\t%s\t| %s | %s | %s | [%s](https://github.com/%s/releases/download/%s/%s) |\n' \
              "$platform_order" "$architecture_order" "$format_order" "$platform" "$architecture_display" "$format" \
              "$filename" "${GITHUB_REPOSITORY}" "$TAG_NAME" "$filename" >> "$download_rows"
          }

          for platform in Windows Linux macOS; do
            while IFS= read -r asset; do
              filename="$(basename "$asset")"
              [[ "$filename" == *.sha256sum || "$filename" == SHA256SUMS ]] && continue
              release_row "$platform" "$filename"
            done < <(find release_assets -maxdepth 1 -type f -print | sort)
          done

          {
            echo "# EasyKiConverter $VERSION"
            echo
            echo "EasyKiConverter $VERSION 改善了 EasyEDA 到 KiCad/Altium 的库转换质量，并完善了跨平台发布流程。"
            echo
            echo "## 下载"
            echo
            echo "| 系统 | 架构 | 格式 | 文件 |"
            echo "| --- | --- | --- | --- |"
            LC_ALL=C sort -t $'\t' -k1,1n -k2,2n -k3,3n -k4,4 "$download_rows" | cut -f4-
            echo
            echo "> 下载表按 Windows、Linux、macOS 的系统顺序排列。Windows 文件名使用 x86_64 或 arm64；x86_64 适用于 Intel/AMD 64 位设备，arm64 适用于 Windows on Arm 设备。"
            echo
            echo "## 重要变化"
            echo
            echo "- 改进符号原点归一化、Pin Name/Pin Number 原始坐标及网格对齐。"
            echo "- 改进 EasyEDA SVG 圆弧、曲线和连续参数解析。"
            echo "- 修复 KiCad 封装弧线格式兼容性问题。"
            echo
            echo "## 变更分类"
            echo
            for category in '新功能|feat' '问题修复|fix' '重构与性能|refactor' '测试|test' '构建与 CI|ci' '文档|docs'; do
              title="${category%%|*}"
              prefix="${category##*|}"
              echo "### $title"
              found=false
              while IFS=$'\t' read -r subject hash; do
                if [[ "$subject" == "$prefix:"* || "$subject" == "$prefix("* ]]; then
                  echo "- $subject ([${hash}](https://github.com/${GITHUB_REPOSITORY}/commit/${hash}))"
                  found=true
                fi
              done < <(git log "$range" --no-merges --format='%s%x09%h')
              [[ "$found" == true ]] || echo "- 无"
              echo
            done
            echo "## 转换格式"
            echo
            echo "- KiCad 符号库和封装库"
            echo "- Altium SchLib 和 PcbLib"
            echo "- STEP 三维模型"
            echo
            echo "## 构建与验证"
            echo
            for platform_status in \
              "Linux:${LINUX_RESULT}" \
              "Windows:${WINDOWS_RESULT}" \
              "macOS:${MACOS_RESULT}"; do
              platform="${platform_status%%:*}"
              result="${platform_status##*:}"
              echo "- $platform 构建任务：$result。"
            done
            echo "- 发布前已验证全部制品及 SHA256 校验和。"
            echo
            echo "## 校验和"
            echo
            echo "每个制品附带同名的 .sha256sum 文件；也可以下载 SHA256SUMS 统一校验清单验证本次发布的全部制品。"
            echo
            echo "## 已知问题"
            echo
            echo "- 部分 EasyEDA 非标准 SVG 路径仍可能需要人工复核。"
            echo "- Altium 对极少数特殊引脚装饰的表达能力有限。"
            echo
            echo "## 贡献者"
            echo
            git shortlog -sne "$range" | sed -E 's/^ *[0-9]+[[:space:]]+/- /' || echo "- 无"
            echo
            echo "构建提交：$TARGET_SHA"
          } > release_notes.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve-target.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' >/tmp/release_is_draft 2>/dev/null; then
            if [[ "$(cat /tmp/release_is_draft)" != true ]]; then
              echo "A published release already exists for $TAG_NAME"
              exit 1
            fi
            gh release edit "$TAG_NAME" --title "EasyKiConverter ${TAG_NAME#[vV]}" --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" --draft --title "EasyKiConverter ${TAG_NAME#[vV]}" --notes-file release_notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve-target.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in release_assets/*; do
            gh release upload "$TAG_NAME" "$asset" --clobber
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve-target.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false
