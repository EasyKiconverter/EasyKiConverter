name: Packaging(Windows)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to package'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to package'
        required: true
        type: string
      target_sha:
        description: '固定的发布提交 SHA'
        required: false
        type: string

permissions:
  contents: read

env:
  PRODUCT: EasyKiConverter
  QT_VERSION: '6.10.2'
  CMAKE_VERSION: '3.22'

jobs:
  windows-pack:
    name: 'Windows ${{ matrix.config.package_arch }}-${{ matrix.type }}'
    runs-on: ${{ matrix.config.runner }}
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
    strategy:
      fail-fast: false
      matrix:
        qt_target: [desktop]
        config:
          - runner: 'windows-2022'
            arch: 'x64'
            generator: 'Ninja'
            gen_arch: ''
            vcpkg_triplet: 'x64-windows'
            qt_host: 'windows'
            qt_arch: 'win64_msvc2022_64'
            setup_cmake: true
            package_arch: 'x64'
            file_arch: 'x86_64'
          - runner: 'windows-11-arm'
            arch: 'arm64'
            generator: 'Ninja'
            gen_arch: ''
            vcpkg_triplet: 'arm64-windows'
            qt_host: 'windows_arm64'
            qt_arch: 'win64_msvc2022_arm64'
            setup_cmake: false
            package_arch: 'arm64'
            file_arch: 'arm64'
        type: [portable, installer]
    steps:
      - name: 'Checkout Source code'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha || inputs.tag_name || github.ref }}

      - name: 'Record Start Time'
        shell: pwsh
        run: echo "BUILD_START_TIME=$(Get-Date -Format o)" >> $env:GITHUB_ENV

      - name: 'Fix Python path'
        shell: pwsh
        run: |
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue

      - name: 'Get Version Info'
        id: version
        uses: ./.github/actions/get-version
        with:
          tag_name: ${{ inputs.tag_name }}

      - name: 'Export Version to Env'
        shell: bash
        run: |
          {
            echo "VERSION=${{ steps.version.outputs.VERSION }}"
            echo "VER_INFO=${{ steps.version.outputs.VER_INFO }}"
            echo "GIT_HASH=${{ steps.version.outputs.GIT_HASH }}"
          } >> "$GITHUB_ENV"

      - name: 'Setup MSVC'
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ matrix.config.arch }}

      - name: 'Setup vcpkg'
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.config.vcpkg_triplet }}

      - name: 'Setup Build Environment'
        uses: ./.github/actions/setup-env
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          qt-version: ${{ env.QT_VERSION }}
          qt-host: ${{ matrix.config.qt_host }}
          qt-target: ${{ matrix.qt_target }}
          qt-arch: ${{ matrix.config.qt_arch }}
          setup-cmake: ${{ matrix.config.setup_cmake }}
          enable-ccache: 'false'
          enable-sccache: 'false'

      - name: 'Install Ninja'
        shell: pwsh
        run: |
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) {
            Write-Host "Ninja is already available:"
            ninja --version
          } else {
            choco install ninja --version=1.12.1 -y --no-progress
          }

      - name: 'Setup Inno Setup'
        if: matrix.type == 'installer'
        shell: pwsh
        run: |
          # 优先使用 runner 已安装的 Inno Setup，避免 Chocolatey 因版本更高而失败。
          $innoCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $innoCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($innoCommand) {
            $innoCandidates += $innoCommand.Source
          }

          $innoPath = $innoCandidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1
          if ($innoPath) {
            Write-Host "Inno Setup is already available: $innoPath"
          } else {
            choco install innosetup -y --no-progress
            $innoPath = $innoCandidates |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1
          }
          if (-not $innoPath) {
            Write-Error "Inno Setup compiler (ISCC.exe) was not found after installation."
            exit 1
          }
          "INNO_SETUP_PATH=$innoPath" >> $env:GITHUB_ENV

          # 下载并安装简体中文语言文件（可选，失败不影响构建）
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $langUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
          try {
            Invoke-WebRequest -Uri $langUrl -OutFile "$langDir\ChineseSimplified.isl" -UseBasicParsing -ErrorAction Stop
            Write-Host "✓ Chinese Simplified language file installed"
          } catch {
            Write-Warning "⚠ Failed to download Chinese Simplified language file: $_"
            Write-Warning "The installer will use default language only"
          }

      - name: 'Configure'
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          cmake -B build -G "${{ matrix.config.generator }}" ${{matrix.config.gen_arch}} `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_SYMBOL_FOOTPRINT_DEBUG_EXPORT=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVERSION_FROM_CI="${{ env.VERSION }}"

      - name: 'Compile'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: 'Build Statistics'
        if: always()
        shell: pwsh
        run: |
          $endTime = Get-Date
          $startTime = [DateTime]::Parse($env:BUILD_START_TIME)
          $duration = $endTime - $startTime
          $rate = 0.016
          $cost = [math]::Round($duration.TotalMinutes * $rate, 4)
          $buildSize = if (Test-Path build) { [math]::Round((Get-ChildItem -Path build -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB, 1) } else { 0 }
          $freeDisk = [math]::Round((Get-PSDrive -Name (Get-Location).Drive.Name).Free / 1GB, 1)
          "## Build Cost Summary (Windows Pack)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Metric | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|--------|-------|" >> $env:GITHUB_STEP_SUMMARY
          "| Job duration | $([math]::Floor($duration.TotalMinutes))m $($duration.Seconds)s |" >> $env:GITHUB_STEP_SUMMARY
          "| Est. cost | `$${cost} (Windows × `$0.016/min) |" >> $env:GITHUB_STEP_SUMMARY
          "| Build dir size | ${buildSize} MB |" >> $env:GITHUB_STEP_SUMMARY
          "| Free disk | ${freeDisk} GB |" >> $env:GITHUB_STEP_SUMMARY

      - name: 'Deploy Qt dependencies'
        shell: pwsh
        run: |
          $exePath = "$env:GITHUB_WORKSPACE\build\bin\easykiconverter.exe"
          $deployDir = Split-Path -Parent $exePath
          Write-Host "Running windeployqt on $exePath"
          # Rely on PATH to find windeployqt
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --qmldir "$env:GITHUB_WORKSPACE\src\ui\qml" $exePath

          # Qt 6.10 windeployqt can copy Windows ICU shim DLLs from the runner.
          # On older Windows 10/LTSC systems, a bundled icuuc.dll may depend on
          # icu.dll that is not present, causing startup to fail before Qt loads.
          foreach ($icuShim in @("icu.dll", "icuin.dll", "icuuc.dll")) {
            $icuShimPath = Join-Path $deployDir $icuShim
            if (Test-Path $icuShimPath) {
              Remove-Item $icuShimPath -Force
              Write-Host "Removed Windows system ICU shim from package: $icuShim"
            }
          }

      - name: 'Verify Windows deployment contents'
        shell: pwsh
        run: |
          $deployDir = "$env:GITHUB_WORKSPACE\build\bin"
          $requiredFiles = @(
            "easykiconverter.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Qml.dll",
            "platforms\qwindows.dll"
          )

          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $deployDir $relativePath
            if (-not (Test-Path $path)) {
              Write-Error "Required deployment file is missing: $relativePath"
              exit 1
            }
          }

          $unsafeIcuDlls = Get-ChildItem -Path $deployDir -Filter "icu*.dll" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("icu.dll", "icuin.dll", "icuuc.dll") }
          if ($unsafeIcuDlls) {
            Write-Error "Unsafe Windows system ICU shim DLLs remain in deployment: $($unsafeIcuDlls.Name -join ', ')"
            exit 1
          }

          Write-Host "Windows deployment verification passed."

      - name: 'Create portable package'
        if: matrix.type == 'portable'
        shell: pwsh
        run: |
          mkdir -p $env:GITHUB_WORKSPACE\build\Package\portable
          Copy-Item -Path $env:GITHUB_WORKSPACE\build\bin\* -Destination $env:GITHUB_WORKSPACE\build\Package\portable\ -Recurse
          Copy-Item -Path $env:GITHUB_WORKSPACE\build\lib\* -Destination $env:GITHUB_WORKSPACE\build\Package\portable\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path $env:GITHUB_WORKSPACE\README*.md -Destination $env:GITHUB_WORKSPACE\build\Package\portable\ -ErrorAction SilentlyContinue
          Copy-Item -Path $env:GITHUB_WORKSPACE\LICENSE -Destination $env:GITHUB_WORKSPACE\build\Package\portable\
          Compress-Archive -Path $env:GITHUB_WORKSPACE\build\Package\portable\* -DestinationPath $env:GITHUB_WORKSPACE\build\Package\portable\${env:PRODUCT}-${env:VERSION}-windows-${{ matrix.config.file_arch }}-portable.zip

      - name: 'Smoke test portable executable'
        if: matrix.type == 'portable'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = "$env:GITHUB_WORKSPACE\build\Package\portable\easykiconverter.exe"
          if (-not (Test-Path $executable)) {
            Write-Error "Portable executable not found: $executable"
            exit 1
          }
          try {
            $output = & $executable --version 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host "Portable executable output:`n$output"
          } catch {
            Write-Error "Portable executable could not be started: $($_.Exception.Message)"
            exit 1
          }
          if ($exitCode -ne 0) {
            Write-Error "Portable executable smoke test failed with exit code: $exitCode"
            exit 1
          }

      - name: 'Create installer package'
        if: matrix.type == 'installer'
        shell: pwsh
        run: |
          # 1. Prepare Staging Directory
          $stagingDir = "$env:GITHUB_WORKSPACE\build\Staging"
          mkdir -p $stagingDir
          Copy-Item -Path $env:GITHUB_WORKSPACE\build\bin\* -Destination $stagingDir -Recurse
          # Copy dependencies (if any separate lib dir exists, though windeployqt usually puts them in bin)
          if (Test-Path "$env:GITHUB_WORKSPACE\build\lib") {
            Copy-Item -Path $env:GITHUB_WORKSPACE\build\lib\* -Destination $stagingDir -Recurse -ErrorAction SilentlyContinue
          }

          # 2. Run Inno Setup Compiler
          # We pass variables: MyAppVersion, SourceDir, OutputDir
          $outputDir = "$env:GITHUB_WORKSPACE\build\Package\installer"
          mkdir -p $outputDir

          $issFile = "$env:GITHUB_WORKSPACE\resources\windows_setup.iss"

          # ISCC command
          # Note: SourceDir must be absolute
          $iconPath = "$env:GITHUB_WORKSPACE\resources\icons\app_icon.ico"
          $licensePath = "$env:GITHUB_WORKSPACE\LICENSE"
          
          if (-not (Test-Path $iconPath)) {
            Write-Error "Icon file not found at: $iconPath"
            exit 1
          }
          if (-not (Test-Path $licensePath)) {
            Write-Error "License file not found at: $licensePath"
            exit 1
          }
          
          & "$env:INNO_SETUP_PATH" "/DMyAppVersion=${{ env.VERSION }}" "/DSourceDir=$stagingDir" "/DAppIconPath=$iconPath" "/DLicensePath=$licensePath" "/O$outputDir" "$issFile"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup Compiler failed with exit code: $LASTEXITCODE"
            exit 1
          }

          # Rename output to standard format
          $setupExe = Get-ChildItem -Path $outputDir -Filter "EasyKiConverter_*_Setup.exe" | Select-Object -First 1
          $newContentName = "${env:PRODUCT}-${env:VERSION}-windows-${{ matrix.config.file_arch }}-installer.exe"
          Rename-Item -Path $setupExe.FullName -NewName $newContentName

          Write-Host "Installer created at: $outputDir\$newContentName"

      - name: 'SHA256Sum of Windows portable'
        if: matrix.type == 'portable'
        shell: pwsh
        run: |
          $fileName = "${env:PRODUCT}-${env:VERSION}-windows-${{ matrix.config.file_arch }}-portable.zip"
          $filePath = "$env:GITHUB_WORKSPACE\build\Package\portable\$fileName"
          $hash = Get-FileHash -Path $filePath -Algorithm SHA256
          $hashString = $hash.Hash.ToLower() + " *" + $fileName
          $hashString | Out-File -FilePath "$filePath.sha256sum" -Encoding ascii
          Write-Host "Generated SHA256: $hashString"

      - name: 'SHA256Sum of Windows installer'
        if: matrix.type == 'installer'
        shell: pwsh
        run: |
          $fileName = "${env:PRODUCT}-${env:VERSION}-windows-${{ matrix.config.file_arch }}-installer.exe"
          $filePath = "$env:GITHUB_WORKSPACE\build\Package\installer\$fileName"
          $hash = Get-FileHash -Path $filePath -Algorithm SHA256
          $hashString = $hash.Hash.ToLower() + " *" + $fileName
          $hashString | Out-File -FilePath "$filePath.sha256sum" -Encoding ascii
          Write-Host "Generated SHA256: $hashString"

      - name: 'Prepare MSIX Manifest'
        if: matrix.type == 'installer'
        shell: pwsh
        run: |
          # 1. 解析版本号为四段数字 (MSIX 严格要求 Major.Minor.Build.Revision)
          $rawVersion = "${{ env.VERSION }}"
          # 移除可能的 'v' 前缀或非数字后缀
          $cleanVersion = $rawVersion -replace '[^0-9.]', ''
          $parts = $cleanVersion.Split('.')
          while ($parts.Count -lt 4) { $parts += "0" }
          $msixVersion = ($parts[0..3] -join '.')

          Write-Host "Converted Version: $rawVersion -> $msixVersion"

          # 2. 更新 AppxManifest.xml 中的版本号
          $manifestPath = "$env:GITHUB_WORKSPACE\deploy\windows\AppxManifest.xml"
          if (Test-Path $manifestPath) {
            [xml]$xml = Get-Content $manifestPath
            $xml.Package.Identity.Version = $msixVersion
            $expectedArchitecture = "${{ matrix.config.package_arch }}"
            if ($expectedArchitecture -notin @('x64', 'arm64')) {
              Write-Error "Unsupported MSIX architecture: $expectedArchitecture"
              exit 1
            }
            $xml.Package.Identity.ProcessorArchitecture = $expectedArchitecture
            $xml.Save($manifestPath)
            Write-Host "Manifest version updated to: $msixVersion"
            Write-Host "Manifest architecture updated to: $expectedArchitecture"
          } else {
            Write-Error "AppxManifest.xml not found at $manifestPath"
            exit 1
          }

          # 3. 复制应用图标和清单文件到 staging 目录（MakeAppx 需要）
          $stagingDir = "$env:GITHUB_WORKSPACE\build\Staging"
          
          # 复制图标
          $iconSource = "$env:GITHUB_WORKSPACE\resources\icons\app_icon.png"
          if (Test-Path $iconSource) {
            Copy-Item -Path $iconSource -Destination "$stagingDir\app_icon.png" -Force
            Write-Host "Icon copied to staging directory"
          }
          
          # 复制 AppxManifest.xml 到 staging 目录（MakeAppx 必须在源目录中找到此文件）
          $manifestPath = "$env:GITHUB_WORKSPACE\deploy\windows\AppxManifest.xml"
          if (Test-Path $manifestPath) {
            Copy-Item -Path $manifestPath -Destination "$stagingDir\AppxManifest.xml" -Force
            Write-Host "Manifest copied to staging directory"
          } else {
            Write-Error "AppxManifest.xml not found at $manifestPath"
            exit 1
          }

      - name: 'Create MSIX package'
        if: matrix.type == 'installer'
        shell: pwsh
        run: |
                # 使用 MakeAppx 直接打包已有的文件结构（不使用 MSIX Packaging Tool）
                # 注意：AppxManifest.xml 必须在 staging 目录中，文件名必须为 AppxManifest.xml
                $stagingDir = "$env:GITHUB_WORKSPACE\build\Staging"
                $outputDir = "$env:GITHUB_WORKSPACE\build\Package\msix"
                $msixPath = "$outputDir\${env:PRODUCT}-${env:VERSION}-windows-${{ matrix.config.file_arch }}.msix"
      
                mkdir -p $outputDir
      
                # 验证 staging 目录中包含 AppxManifest.xml
                $manifestInStaging = "$stagingDir\AppxManifest.xml"
                if (-not (Test-Path $manifestInStaging)) {
                  Write-Error "AppxManifest.xml not found in staging directory at $manifestInStaging"
                  exit 1
                }

                [xml]$stagingManifest = Get-Content $manifestInStaging
                $expectedArchitecture = "${{ matrix.config.package_arch }}"
                $actualArchitecture = $stagingManifest.Package.Identity.ProcessorArchitecture
                if ($actualArchitecture -ne $expectedArchitecture) {
                  Write-Error "MSIX architecture mismatch: expected '$expectedArchitecture', got '$actualArchitecture'"
                  exit 1
                }
                Write-Host "MSIX manifest architecture verified: $actualArchitecture"

                $packagedExecutable = Join-Path $stagingDir 'easykiconverter.exe'
                if (-not (Test-Path $packagedExecutable)) {
                  Write-Error "MSIX executable not found in staging directory: $packagedExecutable"
                  exit 1
                }
      
                # 查找 MakeAppx.exe (Windows SDK 自带)
                # GitHub Actions windows-2022 默认安装了 Windows 10/11 SDK
                $makeAppxPath = "MakeAppx.exe"
      
                # 打包命令
                # /d: 源目录（必须包含 AppxManifest.xml）
                # /p: 输出路径
                # /l: 允许生成未签名的包（稍后由微软签名）
                & $makeAppxPath pack /d "$stagingDir" /p "$msixPath" /l
      
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "MakeAppx failed with exit code: $LASTEXITCODE"
                  exit 1
                }
                Write-Host "MSIX package created at: $msixPath"
                Write-Host "Package size: $((Get-Item $msixPath).Length / 1MB) MB"
      - name: 'SHA256Sum of MSIX package'
        if: matrix.type == 'installer'
        shell: pwsh
        run: |
          $fileName = "${env:PRODUCT}-${env:VERSION}-windows-${{ matrix.config.file_arch }}.msix"
          $filePath = "$env:GITHUB_WORKSPACE\build\Package\msix\$fileName"
          $hash = Get-FileHash -Path $filePath -Algorithm SHA256
          $hashString = $hash.Hash.ToLower() + " *" + $fileName
          $hashString | Out-File -FilePath "$filePath.sha256sum" -Encoding ascii
          Write-Host "Generated SHA256: $hashString"

      - name: 'Artifact Upload (portable)'
        if: matrix.type == 'portable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasyKiConverter-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}-portable
          path: |
            ${{ github.workspace }}/build/Package/portable/${{ env.PRODUCT }}-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}-portable.zip
            ${{ github.workspace }}/build/Package/portable/${{ env.PRODUCT }}-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}-portable.zip.sha256sum
          overwrite: true

      - name: 'Artifact Upload (installer)'
        if: matrix.type == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasyKiConverter-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}-installer
          path: |
            ${{ github.workspace }}/build/Package/installer/${{ env.PRODUCT }}-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}-installer.exe
            ${{ github.workspace }}/build/Package/installer/${{ env.PRODUCT }}-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}-installer.exe.sha256sum
          overwrite: true

      - name: 'Artifact Upload (MSIX)'
        if: matrix.type == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasyKiConverter-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}-msix
          path: |
            ${{ github.workspace }}/build/Package/msix/${{ env.PRODUCT }}-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}.msix
            ${{ github.workspace }}/build/Package/msix/${{ env.PRODUCT }}-${{ env.VERSION }}-windows-${{ matrix.config.file_arch }}.msix.sha256sum
          overwrite: true
          if-no-files-found: error
