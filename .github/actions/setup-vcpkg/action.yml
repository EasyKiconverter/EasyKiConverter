name: 'Setup vcpkg'
description: 'Bootstrap the repository-pinned vcpkg baseline without a third-party Action'

inputs:
  triplet:
    description: 'vcpkg target triplet'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 'Bootstrap pinned vcpkg'
      shell: pwsh
      env:
        VCPKG_BASELINE: 544a4c5c297e60e4ac4a5a1810df66748d908869
      run: |
        $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
        if (Test-Path $vcpkgRoot) {
          Remove-Item $vcpkgRoot -Recurse -Force
        }

        git clone --quiet https://github.com/microsoft/vcpkg.git $vcpkgRoot
        git -C $vcpkgRoot fetch --quiet --depth 1 origin $env:VCPKG_BASELINE
        git -C $vcpkgRoot checkout --quiet $env:VCPKG_BASELINE
        & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
        if ($LASTEXITCODE -ne 0) {
          throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
        }

        "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_DEFAULT_TRIPLET=${{ inputs.triplet }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_TARGET_TRIPLET=${{ inputs.triplet }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        & (Join-Path $vcpkgRoot 'vcpkg.exe') install `
          --triplet ${{ inputs.triplet }} `
          --x-manifest-root $env:GITHUB_WORKSPACE `
          --x-install-root (Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg_installed') `
          --disable-metrics
        if ($LASTEXITCODE -ne 0) {
          throw "vcpkg install failed with exit code $LASTEXITCODE"
        }
