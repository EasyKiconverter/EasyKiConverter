name: 'Setup Build Environment'
description: 'Setup CMake, Qt, and build cache for EasyKiConverter project'

inputs:
  cmake-version:
    description: 'CMake version to install'
    required: false
    default: '3.22'
  setup-cmake:
    description: 'Whether to install the pinned CMake version'
    required: false
    default: 'true'
  qt-version:
    description: 'Qt version to install'
    required: false
    default: '6.10.2'
  qt-host:
    description: 'Qt host platform'
    required: false
    default: 'linux'
  qt-target:
    description: 'Qt target platform'
    required: false
    default: 'desktop'
  qt-arch:
    description: 'Qt architecture'
    required: false
    default: ''
  qt-modules:
    description: 'Qt modules to install'
    required: false
    default: ''
  enable-ccache:
    description: 'Enable CCache (Linux/macOS)'
    required: false
    default: 'true'
  enable-sccache:
    description: 'Enable sccache (Windows)'
    required: false
    default: 'true'
  install-linux-deps:
    description: 'Install Linux system dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 'Install Linux Dependencies'
      if: inputs.install-linux-deps == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get -y -qq update
        sudo apt-get -y --no-install-recommends install \
          cmake \
          build-essential \
          libgl1-mesa-dev \
          libxcb-xinerama0 \
          libxcb-cursor0 \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-shape0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render0 \
          libxcb-shm0 \
          libxcb-util1 \
          libwayland-dev \
          libegl1-mesa-dev \
          libgles2-mesa-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libdbus-1-dev \
          libglib2.0-0

    - name: 'Setup Python for Qt installation'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: 'Verify CMake'
      if: inputs.setup-cmake == 'true'
      shell: bash
      run: |
        cmake --version

    - name: 'Install Qt with aqtinstall'
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check --no-cache-dir aqtinstall==3.2.1

        qt_arch="${{ inputs.qt-arch }}"
        if [ -z "$qt_arch" ]; then
          case "${{ runner.os }}" in
            macOS) qt_arch="clang_64" ;;
            *)
              echo "qt-arch is required for ${{ runner.os }}" >&2
              exit 1
              ;;
          esac
        fi

        qt_root="$RUNNER_TEMP/qt"
        qt_modules=()
        if [ -n "${{ inputs.qt-modules }}" ]; then
          read -r -a qt_modules <<< "${{ inputs.qt-modules }}"
        else
          qt_modules=(qtshadertools qtimageformats)
        fi

        qt_version_root="$qt_root/${{ inputs.qt-version }}"
        qt_install_succeeded=false
        for attempt in 1 2; do
          echo "Installing Qt (attempt $attempt/2)"
          rm -rf "$qt_version_root"
          if python -m aqt install-qt "${{ inputs.qt-host }}" "${{ inputs.qt-target }}" \
            "${{ inputs.qt-version }}" "$qt_arch" \
            --outputdir "$qt_root" --modules "${qt_modules[@]}"; then
            qt_install_succeeded=true
            break
          fi

          if [ "$attempt" -lt 2 ]; then
            echo "Qt installation failed; removing the incomplete archive before retrying." >&2
            sleep 5
          fi
        done

        if [ "$qt_install_succeeded" != "true" ]; then
          echo "Qt installation failed after two clean attempts." >&2
          exit 1
        fi

        qt_cmake_dir=$(find "$qt_root/${{ inputs.qt-version }}" -type d -path '*/lib/cmake/Qt6' -print -quit)
        if [ -z "$qt_cmake_dir" ]; then
          echo "Qt6 CMake directory was not found below $qt_root" >&2
          find "$qt_root/${{ inputs.qt-version }}" -maxdepth 3 -type d >&2
          exit 1
        fi

        qt_dir="${qt_cmake_dir%/lib/cmake/Qt6}"
        echo "$qt_dir/bin" >> "$GITHUB_PATH"
        echo "Qt6_DIR=$qt_dir/lib/cmake/Qt6" >> "$GITHUB_ENV"

    - name: 'Setup CCache'
      if: inputs.enable-ccache == 'true' && (runner.os == 'Linux' || runner.os == 'macOS')
      shell: bash
      run: |
        if command -v ccache >/dev/null 2>&1; then
          ccache --version
        elif [ "${{ runner.os }}" = "macOS" ]; then
          brew install ccache
        else
          sudo apt-get update
          sudo apt-get install -y ccache
        fi

    - name: 'Check CMake and Qt environment'
      shell: bash
      run: |
        cmake --version
        qmake --version

    # Windows 当前工作流未启用 sccache，保留输入参数以兼容现有调用方。
    # 不在此处加载额外的第三方 Action，避免突破仓库的 Actions 允许策略。
