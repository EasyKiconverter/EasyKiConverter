# GitHub Actions Labeler 配置文件
# 根据修改的文件路径自动为 Pull Request 分配标签
#
# v5 格式文档: https://github.com/actions/labeler

# 文档相关
"docs / 文档":
  - changed-files:
      - any-glob-to-any-file:
          - docs/**/*
          - README*.md
          - CHANGELOG*.md
          - LICENSE
          - AGENTS.md
          - GEMINI.md

# 核心转换引擎
"core / 核心":
  - changed-files:
      - any-glob-to-any-file:
          - src/core/**/*

# 数据模型
"models / 数据模型":
  - changed-files:
      - any-glob-to-any-file:
          - src/models/**/*

# 服务层
"services / 服务":
  - changed-files:
      - any-glob-to-any-file:
          - src/services/**/*

# UI 层
"ui / 界面":
  - changed-files:
      - any-glob-to-any-file:
          - src/ui/**/*

# 工作线程
"workers / 工作线程":
  - changed-files:
      - any-glob-to-any-file:
          - src/workers/**/*

# 工具类
"utils / 工具":
  - changed-files:
      - any-glob-to-any-file:
          - src/utils/**/*

# 仓库工具与开发脚本
"tools / 工具":
  - changed-files:
      - any-glob-to-any-file:
          - tools/**/*

# 测试
"test / 测试":
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*

# CI/CD
"ci / 持续集成":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
          - CMakeLists.txt
          - .gitignore

# 资源文件
"resources / 资源":
  - changed-files:
      - any-glob-to-any-file:
          - resources/**/*

# 格式与数据源模块
"easyeda / 嘉立创":
  - changed-files:
      - any-glob-to-any-file:
          - src/core/easyeda/**/*

"kicad / KiCad":
  - changed-files:
      - any-glob-to-any-file:
          - src/core/kicad/**/*

"network / 网络":
  - changed-files:
      - any-glob-to-any-file:
          - src/core/network/**/*

"cli / 命令行":
  - changed-files:
      - any-glob-to-any-file:
          - src/cli/**/*
