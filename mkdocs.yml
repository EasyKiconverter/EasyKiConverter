site_name: EasyKiConverter Documentation
site_description: Documentation for EasyKiConverter - LCSC and EasyEDA component converter for KiCad, Altium, and Xpedition libraries
site_author: tangsangsimida
site_url: https://easykiconverter.github.io/EasyKiConverter/
repo_url: https://github.com/EasyKiconverter/EasyKiConverter
edit_uri: edit/master/docs/

# 未在导航中列出的页面不产生警告（英文版本文档）
not_in_nav: |
  /**/*_en.md
  /project/adr/*.md

# 版本信息（可通过 macros 插件在页面中使用）
extra:
  version: 3.1.13
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EasyKiconverter/EasyKiConverter
      name: GitHub

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

nav:
  - 首页: index.md
  - 用户指南:
    - 快速入门: user/GETTING_STARTED.md
    - 用户手册: user/USER_GUIDE.md
    - 功能特性: user/FEATURES.md
    - 调试模式: user/DEBUG_MODE.md
    - 常见问题: user/FAQ.md
    - 隐私政策: user/PRIVACY_POLICY.md
    - 安装程序返回代码: user/INSTALLATION_CODES.md
  - 开发者指南:
    - 贡献指南: developer/CONTRIBUTING.md
    - 架构设计: developer/ARCHITECTURE.md
    - 格式解析架构: developer/PARSER_ARCHITECTURE.md
    - Allegro Native 格式研究: developer/ALLEGRO_NATIVE_FORMAT_RESEARCH.md
    - 构建指南: developer/BUILD.md
    - 代码风格: developer/CODING_STYLE.md
    - 测试指南: developer/TESTING_GUIDE.md
    - BOM 解析指南: developer/BOM_PARSING_GUIDE.md
    - 开发者常见问题: developer/FAQ.md
    - 变更日志:
      - 变更日志: developer/CHANGELOG.md
      - v3.1.x: developer/changelog/3.1.4.md
      - v3.0.x: developer/changelog/3.0.14.md
      - v2.0.x: developer/changelog/2.0.0.md
      - v1.0.x: developer/changelog/1.0.0.md
  - 项目信息:
    - 路线图: project/ROADMAP.md
    - 日志架构: project/LOGGING_ARCHITECTURE.md
  - API 参考:
    - 概述: api/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang:
        - zh
        - en

# 输出目录（统一到 build/docs/site/）
docs_path: docs
site_dir: build/docs/site
